AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Sarcasm Sync Chat App SAM Template

Parameters:
  AWS_COGNITO_USER_POOL_ID:
    Type: String
    Description: Cognito User Pool ID
    Default: "us-east-1_XXXXX"

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        ENVIRONMENT: dev
        POSTGRES_HOST: host.docker.internal
        POSTGRES_PORT: 5432
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: root
        POSTGRES_DB: chat
        REDIS_HOST: host.docker.internal
        REDIS_PORT: 6379

Resources:
  ChatApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${AWS_COGNITO_USER_POOL_ID}"

  # Auth Lambdas
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: auth_lambda.endpoint_register
      Events:
        RegisterApi:
          Type: Api
          Properties:
            Path: /auth/register
            Method: post
            RestApiId: !Ref ChatApi
            Auth:
              Authorizer: NONE

  ConfirmRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: auth_lambda.endpoint_confirm_register
      Events:
        ConfirmRegisterApi:
          Type: Api
          Properties:
            Path: /auth/confirm
            Method: post
            RestApiId: !Ref ChatApi
            Auth:
              Authorizer: NONE

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: auth_lambda.endpoint_login
      Events:
        LoginApi:
          Type: Api
          Properties:
            Path: /auth/login
            Method: post
            RestApiId: !Ref ChatApi
            Auth:
              Authorizer: NONE

  RefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: auth_lambda.endpoint_refresh
      Events:
        RefreshApi:
          Type: Api
          Properties:
            Path: /auth/refresh
            Method: post
            RestApiId: !Ref ChatApi
            Auth:
              Authorizer: NONE

  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: auth_lambda.endpoint_logout
      Events:
        LogoutApi:
          Type: Api
          Properties:
            Path: /auth/logout
            Method: post
            RestApiId: !Ref ChatApi

  # Friends Lambdas
  SendFriendRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambdas.friends_lambda.endpoint_send_friend_request
      Events:
        Api:
          Type: Api
          Properties:
            Path: /friends/send_friend_request
            Method: post
            RestApiId: !Ref ChatApi

  AcceptFriendRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambdas.friends_lambda.endpoint_accept_friendrequest
      Events:
        Api:
          Type: Api
          Properties:
            Path: /friends/accept/{friend_id}
            Method: patch
            RestApiId: !Ref ChatApi

  RejectFriendRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambdas.friends_lambda.endpoint_reject_friend_request
      Events:
        Api:
          Type: Api
          Properties:
            Path: /friends/reject/{friend_id}
            Method: patch
            RestApiId: !Ref ChatApi

  BlockFriendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambdas.friends_lambda.endpoint_block_friend
      Events:
        Api:
          Type: Api
          Properties:
            Path: /friends/block/{friend_id}
            Method: patch
            RestApiId: !Ref ChatApi

  GetAllFriendsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambdas.friends_lambda.endpoint_get_all_friends
      Events:
        Api:
          Type: Api
          Properties:
            Path: /friends/allfriends
            Method: get
            RestApiId: !Ref ChatApi

  RemoveFriendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambdas.friends_lambda.endpoint_remove_friend
      Events:
        Api:
          Type: Api
          Properties:
            Path: /friends/removefriend/{friend_id}
            Method: delete
            RestApiId: !Ref ChatApi

  PeopleYouMayKnowFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambdas.friends_lambda.endpoint_people_you_may_know
      Events:
        Api:
          Type: Api
          Properties:
            Path: /friends/peopleyoumayknow
            Method: get
            RestApiId: !Ref ChatApi

  AllFriendRequestsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambdas.friends_lambda.endpoint_all_friend_requests
      Events:
        Api:
          Type: Api
          Properties:
            Path: /friends/friendrequests
            Method: get
            RestApiId: !Ref ChatApi

  # Message Lambdas
  GetMessagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambdas.message_lambda.endpoint_get_messages
      Events:
        Api:
          Type: Api
          Properties:
            Path: /messages/conversations/{other_user_id}
            Method: get
            RestApiId: !Ref ChatApi

  DeleteConversationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambdas.message_lambda.endpoint_delete_conversation
      Events:
        Api:
          Type: Api
          Properties:
            Path: /messages/conversations/{other_user_id}
            Method: delete
            RestApiId: !Ref ChatApi

  GetConversationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambdas.message_lambda.endpoint_get_conversations
      Events:
        Api:
          Type: Api
          Properties:
            Path: /messages/conversations
            Method: get
            RestApiId: !Ref ChatApi

Outputs:
  ChatApiEndpoint:
    Description: "API Gateway endpoint URL for Dev environment"
    Value: !Sub "https://${ChatApi}.execute-api.${AWS::Region}.amazonaws.com/dev/"